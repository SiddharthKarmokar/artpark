site_name: Financial Analytics Platform
site_url: https://siddharthkarmokar.github.io/artpark/
site_description: Internal platform engineering documentation for the Tabular Analytics system.
site_author: Platform Engineering Team

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - .

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Runbook: runbook.md
  - Deployment: deployment.md
  - Observability: observability.md
  - Data Quality: data-quality.md
  - API Reference: api.md
  - CI/CD: ci-cd.md
  - Local Development: local-development.md
  - ADRs:
    - 001 PostgreSQL Migration: adr/001-postgresql.md
    - 002 Redis Caching: adr/002-redis.md
